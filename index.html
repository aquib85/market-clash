<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BullClash — Bulls vs Bears</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#f5f7fb;font-family:Arial,sans-serif}
#app{max-width:900px;margin:auto;padding:24px}
header{text-align:center;margin-bottom:18px}
h1{font-size:42px;margin:0 0 6px}.sub{color:#9db1c8}
.top{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
button{border:1px solid #385a7a;background:#142b45;color:#fff;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}
button:hover:not(:disabled){background:#1c3b5d;transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:not-allowed}
#walletStatus{font-size:13px;color:#9db1c8;background:#0c1b2c;border:1px solid #29435f;border-radius:999px;padding:9px 13px}
.points{display:inline-block;background:#0c1b2c;border:1px solid #29435f;border-radius:999px;padding:9px 13px}
.game{background:#0b1929;border:1px solid #29435f;border-radius:22px;padding:24px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #345371;border-radius:18px;background:#0e2238}
.side .emoji{font-size:72px}.side h2{margin:8px 0 16px}
.bull{border-color:#286b4b}.bear{border-color:#7b3450}
.choice{width:100%;padding:14px;font-size:17px}
#result{text-align:center;min-height:80px;padding:18px 5px;font-size:18px;font-weight:800}
#history{margin-top:16px;background:#050d17;border-radius:12px;padding:12px;min-height:44px;color:#9db1c8;font-size:13px}
.note{text-align:center;color:#71869d;font-size:12px;margin-top:14px}
@media(max-width:650px){h1{font-size:32px}.sides{grid-template-columns:1fr}.side{min-height:150px}}
</style>
</head>
<body>
<div id="app">
<header>
<h1>🐂 BULLCLASH 🐻</h1>
<div class="sub">Choose your side. Win virtual Clash Points.</div>
</header>

<div class="top">
<button id="walletBtn" onclick="connectWallet()">🔗 Connect Wallet</button>
<span id="walletStatus">Wallet not connected</span>
<span class="points">💎 Clash Points: <b id="points">100</b></span>
</div>

<div class="game">
<div class="sides">
<div class="side bull">
<div class="emoji">🐂</div><h2>BULL</h2>
<button class="choice" id="bullBtn" onclick="play('BULL')">Play Bull</button>
</div>
<div class="side bear">
<div class="emoji">🐻</div><h2>BEAR</h2>
<button class="choice" id="bearBtn" onclick="play('BEAR')">Play Bear</button>
</div>
</div>
<div id="result">Connect your wallet, then choose Bull or Bear.</div>
<div id="history">No battles yet.</div>
</div>

<div class="note">100% virtual gameplay. No real money, no blockchain transaction, no entry fee.</div>
</div>

<script>
(function(){
  var points=Number(localStorage.getItem("bullclash_points"));
  if(!Number.isFinite(points)) points=100;
  var wins=Number(localStorage.getItem("bullclash_wins"));
  if(!Number.isFinite(wins)) wins=0;
  var wallet=null,busy=false;

  function $(id){return document.getElementById(id);}
  function shortAddress(a){return a.slice(0,6)+"..."+a.slice(-4);}
  function save(){
    localStorage.setItem("bullclash_points",String(points));
    localStorage.setItem("bullclash_wins",String(wins));
  }
  function render(){
    $("points").textContent=points;
    $("bullBtn").disabled=busy||!wallet;
    $("bearBtn").disabled=busy||!wallet;
  }

  window.connectWallet=async function(){
    if(!window.ethereum){
      $("walletStatus").textContent="⚠️ No wallet found — install MetaMask.";
      return;
    }
    try{
      var accounts=await window.ethereum.request({method:"eth_requestAccounts"});
      if(accounts&&accounts[0]){
        wallet=accounts[0];
        $("walletStatus").textContent="✅ "+shortAddress(wallet);
        $("walletBtn").textContent="✅ Wallet Connected";
        $("result").textContent="Choose Bull or Bear.";
        render();
      }
    }catch(e){
      $("walletStatus").textContent="Connection cancelled.";
    }
  };

  window.play=function(side){
    if(!wallet){$("result").textContent="🔗 Connect your wallet first.";return;}
    if(busy)return;
    busy=true;render();
    $("result").textContent="⚔️ "+side+" selected...";
    setTimeout(function(){
      var winner=Math.random()<0.5?"BULL":"BEAR";
      if(winner===side){
        points+=1;wins+=1;
        $("result").textContent="🎉 "+winner+" WINS! You got +1 Clash Point.";
      }else{
        $("result").textContent="💥 "+winner+" WINS! Better luck next round.";
      }
      $("history").textContent="You played "+side+" · Winner: "+winner+" · Your wins: "+wins;
      save();busy=false;render();
    },700);
  };

  if(window.ethereum){
    window.ethereum.on?.("accountsChanged",function(accounts){
      if(accounts&&accounts[0]){
        wallet=accounts[0];
        $("walletStatus").textContent="✅ "+shortAddress(wallet);
        $("walletBtn").textContent="✅ Wallet Connected";
      }else{
        wallet=null;
        $("walletStatus").textContent="Wallet not connected";
        $("walletBtn").textContent="🔗 Connect Wallet";
      }
      render();
    });
  }
  render();
})();
</script>
</body>
</html>
