<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Clash — Bulls vs Bears</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#f5f7fb;font-family:Arial,sans-serif}
#app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:30px}.tag{color:#91a4bc}.pill{padding:8px 12px;border:1px solid #263d59;border-radius:999px;background:#0b1726}
.arena{margin-top:12px;position:relative;height:590px;border:1px solid #29425f;border-radius:24px;overflow:hidden;background:linear-gradient(#10243a,#07101d 68%,#081522)}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 10%,#274c6d55,transparent 45%)}
.grid{position:absolute;left:-10%;right:-10%;bottom:-90px;height:300px;transform:perspective(400px) rotateX(58deg);background-image:linear-gradient(#3d628055 1px,transparent 1px),linear-gradient(90deg,#3d628055 1px,transparent 1px);background-size:45px 45px}
.chart{position:absolute;left:4%;right:4%;top:26px;height:100px;opacity:.4}.chart:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #8098b266}
canvas{width:100%;height:100%}
.hud{position:absolute;top:18px;left:4%;right:4%;display:grid;grid-template-columns:1fr 160px 1fr;gap:15px;align-items:center}
.player{text-align:center}.label{font-size:18px;font-weight:900}.hpbox,.energybox{height:17px;background:#111d2b;border:1px solid #3a526d;border-radius:12px;overflow:hidden;margin-top:6px}.hp,.energy{height:100%;transition:.3s}.bullhp{background:#25dc7a}.bearhp{background:#ff4665}.energy{background:#47a8ff}.vs{text-align:center;font-size:27px;font-weight:1000}.round{text-align:center;color:#9db1c8;font-size:12px;margin-top:4px}
.fighter{position:absolute;bottom:142px;width:240px;text-align:center;transition:transform .25s}.bull{left:12%}.bear{right:12%}
.char{font-size:125px;line-height:1;filter:drop-shadow(0 14px 8px #000b);user-select:none}.fighter .name{font-size:25px;font-weight:900}.status{color:#9fb1c6;font-size:13px}
.ground{position:absolute;bottom:126px;left:10%;right:10%;height:4px;background:#55718d66;box-shadow:0 0 30px #70a6d544}
.controls{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:min(920px,94%);background:#07111de8;border:1px solid #29425f;border-radius:20px;padding:13px;backdrop-filter:blur(10px)}
.turn{text-align:center;font-weight:900;margin-bottom:9px}.moves{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
button{color:white;background:#132943;border:1px solid #345371;border-radius:11px;padding:10px 6px;font-weight:900;cursor:pointer}button:hover:not(:disabled){background:#1d3c5c;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}
button b{display:block;font-size:18px}.moveinfo{font-size:10px;color:#9db1c8;font-weight:500;margin-top:3px}.danger{background:#482034}.heal{background:#123d35}
.log{height:54px;overflow:auto;margin-top:9px;font-size:12px;color:#aebfd2;background:#040a12;border-radius:9px;padding:6px}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#02060bcc;z-index:10;text-align:center}.winbox{padding:30px;border:1px solid #45627f;border-radius:22px;background:#0b1929;box-shadow:0 20px 80px #000}.winbox h2{font-size:48px;margin:0 0 8px}.winbox p{color:#9fb1c6}
.shake{animation:shake .35s}.lungeL{animation:lungeL .35s}.lungeR{animation:lungeR .35s}.critical{animation:crit .55s}
@keyframes shake{25%{transform:translateX(-22px)}75%{transform:translateX(22px)}}@keyframes lungeL{50%{transform:translateX(65px)}}@keyframes lungeR{50%{transform:translateX(-65px)}}@keyframes crit{50%{filter:drop-shadow(0 0 25px #fff) scale(1.12)}}
@media(max-width:760px){h1{font-size:22px}.arena{height:700px}.fighter{bottom:220px;width:170px}.bull{left:2%}.bear{right:2%}.char{font-size:85px}.hud{grid-template-columns:1fr 55px 1fr}.vs{font-size:18px}.moves{grid-template-columns:repeat(3,1fr)}.controls{bottom:8px}}
</style>
</head>
<body>
<div id="app">
<div class="top"><div><h1>🐂 MARKET CLASH 🐻</h1><div class="tag">Bulls vs Bears — fight for market dominance</div></div><div class="pill">💰 Market: <b id="price">$100</b></div></div>
<div class="arena" id="arena">
<div class="sky"></div><div class="grid"></div>
<div class="chart"><canvas id="cv"></canvas></div>
<div class="hud">
<div class="player"><div class="label">🐂 BULL</div><div class="hpbox"><div id="bhp" class="hp bullhp"></div></div><div class="energybox"><div id="be" class="energy"></div></div></div>
<div class="vs">VS<div class="round" id="round">ROUND 1</div></div>
<div class="player"><div class="label">🐻 BEAR</div><div class="hpbox"><div id="rhp" class="hp bearhp"></div></div><div class="energybox"><div id="re" class="energy"></div></div></div>
</div>
<div class="ground"></div>
<div class="fighter bull" id="bull"><div class="char">🐂</div><div class="name">BULL</div><div class="status" id="bs">Ready to buy</div></div>
<div class="fighter bear" id="bear"><div class="char">🐻</div><div class="name">BEAR</div><div class="status" id="rs">Ready to short</div></div>
<div id="overlay"><div class="winbox"><h2 id="winner">BULL WINS!</h2><p id="reason">The bear was liquidated.</p><button onclick="newGame()">⚔️ Fight Again</button></div></div>
<div class="controls">
<div class="turn" id="turn">Your turn — choose a move</div>
<div class="moves">
<button onclick="attack('pump')"><b>🚀</b>Pump<div class="moveinfo">12–20 dmg · 10 EN</div></button>
<button onclick="attack('break')"><b>📈</b>Breakout<div class="moveinfo">25 dmg · 20 EN</div></button>
<button class="heal" onclick="attack('dip')"><b>💰</b>Buy Dip<div class="moveinfo">+18 HP · 15 EN</div></button>
<button class="danger" onclick="attack('squeeze')"><b>🔥</b>Squeeze<div class="moveinfo">42 dmg · 40 EN</div></button>
<button onclick="attack('shield')"><b>🛡️</b>Hedge<div class="moveinfo">Block next hit · 12 EN</div></button>
<button onclick="attack('allin')"><b>💎</b>ALL-IN<div class="moveinfo">55 dmg · 60 EN</div></button>
</div>
<div class="log" id="log"></div>
</div>
</div>
</div>
<script>
let B,R,BE,RE,block=false,round=1,busy=false,over=false;
const $=id=>document.getElementById(id);
function log(x){$('log').innerHTML='<div>'+x+'</div>'+$('log').innerHTML}
function render(){ $('bhp').style.width=B+'%';$('rhp').style.width=R+'%';$('be').style.width=BE+'%';$('re').style.width=RE+'%';$('price').textContent='$'+Math.max(1,Math.round(100+(B-R)*.35));$('round').textContent='ROUND '+round;
document.querySelectorAll('.moves button').forEach(x=>x.disabled=busy||over)}
function anim(id,c){let e=$(id);e.classList.remove(c);void e.offsetWidth;e.classList.add(c)}
function dmg(n){let crit=Math.random()<.14;return {n:crit?Math.round(n*1.5):n,crit}}
function attack(type){
if(busy||over)return;
const costs={pump:10,break:20,dip:15,squeeze:40,shield:12,allin:60},cost=costs[type];
if(BE<cost){log('⚡ Not enough energy.');return}
BE-=cost;busy=true;let hit=0,heal=0,txt='';
if(type==='pump'){hit=dmg(12+Math.floor(Math.random()*9));txt='🚀 Bull pumped the market for '+hit.n+' damage.'}
if(type==='break'){if(Math.random()<.2){txt='📉 Fakeout! The breakout failed.';hit={n:0,crit:false}}else{hit=dmg(25);txt='📈 Bull broke resistance for '+hit.n+' damage.'}}
if(type==='dip'){heal=18;B=Math.min(100,B+heal);txt='💰 Bull bought the dip and recovered '+heal+' HP.'}
if(type==='squeeze'){hit=dmg(42);txt='🔥 SHORT SQUEEZE! Bear takes '+hit.n+' damage.'}
if(type==='shield'){block=true;txt='🛡️ Bull hedged the position. Next incoming hit is blocked.'}
if(type==='allin'){if(Math.random()<.18){txt='💀 ALL-IN failed! The market rejected the trade.'}else{hit=dmg(55);txt='💎 ALL-IN! Bull dealt '+hit.n+' damage.'}}
log((hit.crit?'💥 CRITICAL! ':'')+txt);
if(hit.n){R=Math.max(0,R-hit.n);anim('bear','shake');anim('bull',hit.crit?'critical':'lungeL')}
if(R<=0){finish('BULL');return}render();
setTimeout(bearTurn,650)
}
function bearTurn(){
if(over)return;let cost=10+Math.floor(Math.random()*16);RE=Math.min(100,RE+12);
let choice=Math.random(),hit=0,txt='';
if(choice<.18){let h=15;R=Math.min(100,R+h);txt='🐻 Bear covered shorts and recovered '+h+' HP.'}
else if(choice<.45){hit=dmg(13+Math.floor(Math.random()*9));txt='📉 Bear dumped for '+hit.n+' damage.'}
else if(choice<.7){hit=dmg(24);txt='💥 Bear caused a market crash for '+hit.n+' damage.'}
else if(choice<.88){hit=dmg(32);txt='🩸 Bear opened a massive short for '+hit.n+' damage.'}
else{hit=dmg(45);txt='☠️ BEAR TRAP! A brutal attack hits for '+hit.n+' damage.'}
if(hit.n){if(block){txt+=' 🛡️ Hedge blocked it!';hit.n=0;block=false}else{B=Math.max(0,B-hit.n);anim('bull','shake');anim('bear',hit.crit?'critical':'lungeR')}}
log((hit.crit?'💥 CRITICAL! ':'')+txt);round++;BE=Math.min(100,BE+8);render();
if(B<=0){finish('BEAR');return}busy=false;$('turn').textContent='Your turn — choose a move';render()
}
function finish(w){over=true;busy=false;$('overlay').style.display='flex';$('winner').textContent=w==='BULL'?'🐂 BULL WINS!':'🐻 BEAR WINS!';$('reason').textContent=w==='BULL'?'The bear has been liquidated. 🚀':'The bull has been liquidated. 📉';render()}
function newGame(){B=100;R=100;BE=100;RE=100;block=false;round=1;busy=false;over=false;$('overlay').style.display='none';$('log').innerHTML='';$('turn').textContent='Your turn — choose a move';log('⚔️ Battle started! The market is neutral.');render()}
const cv=$('cv'),ctx=cv.getContext('2d');function draw(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.beginPath();let y=h*.62;ctx.moveTo(0,y);for(let x=0;x<w;x+=8){y+=(Math.random()-.47)*10;y=Math.max(12,Math.min(h-12,y));ctx.lineTo(x,y)}ctx.lineWidth=3;ctx.strokeStyle='#57d889';ctx.stroke()}window.onresize=draw;draw();newGame();
</script>
</body>
</html>
